# Fabrique les installeurs Mac (Apple Silicon et Intel), Windows et Linux
# quand on pousse une étiquette de version :  git tag v0.2.0 && git push --tags
# ou à la main (onglet Actions, « Run workflow ») : l'étiquette vient alors de la version de l'app
# (package.json, tauri.conf.json), par exemple v0.1.0, et tauri-action la crée.
# Résultat : un brouillon de « Release » GitHub avec .dmg, .msi/.exe, .AppImage/.deb.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature Apple (facultatif, voir README) :
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          # Lancé par une étiquette : celle-ci. Lancé à la main : v + la version de l'app (jamais « main »).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Cosmos ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Première version d'essai de Cosmos, pour macOS (Apple Silicon et Intel), Windows et Linux.

            Installeurs non signés pour l'instant :
            - macOS : au premier lancement, clic droit sur Cosmos puis « Ouvrir » (ou Réglages Système › Confidentialité et sécurité › « Ouvrir quand même »).
            - Windows : si SmartScreen s'affiche, « Informations complémentaires » puis « Exécuter quand même ».

            Pas de mise à jour automatique : chaque version se télécharge ici. Tes projets restent des dossiers de fichiers Markdown, lisibles hors de l'app.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
