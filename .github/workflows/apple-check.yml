# Vérifie les secrets de signature Apple sans rien fabriquer ni publier (onglet Actions, « Run workflow »).
# Chaque étape teste un point : celle qui échoue désigne le secret à corriger.
name: Vérifier la signature Apple

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      - name: Les six secrets sont présents
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; else echo "OK : $name"; fi
          done
          exit $missing

      - name: APPLE_CERTIFICATE et APPLE_CERTIFICATE_PASSWORD (le .p12 s'ouvre)
        id: cert
        run: |
          size=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | wc -c | tr -d ' ')
          if ! printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null || [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::APPLE_CERTIFICATE n'est pas du base64 valide ($size caractères). Recopie la sortie de : base64 -i ~/Desktop/cosmos.p12 | pbcopy"
            exit 1
          fi
          kind=$(file -b "$RUNNER_TEMP/cert.p12")
          echo "Fichier décodé : $(wc -c < "$RUNNER_TEMP/cert.p12") octets, $kind"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -legacy > /dev/null 2>&1 \
            && ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys > /dev/null 2>&1; then
            echo "::error::Le .p12 ne s'ouvre pas avec APPLE_CERTIFICATE_PASSWORD ($size caractères de base64, $(wc -c < "$RUNNER_TEMP/cert.p12") octets décodés). Soit le mot de passe est faux, soit APPLE_CERTIFICATE ne contient pas le bon fichier (par exemple un .cer au lieu du .p12)."
            exit 1
          fi
          security create-keychain -p ci "$RUNNER_TEMP/check.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/check.keychain"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/check.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::macOS refuse d'importer le .p12 (le mot de passe est pourtant bon)."
            exit 1
          fi
          ids=$(security find-identity -v -p codesigning "$RUNNER_TEMP/check.keychain")
          echo "$ids"
          case "$ids" in
            *"0 valid identities"*) echo "::error::Le .p12 contient le certificat mais pas sa clé privée. Réexporte-le depuis Mes certificats (le certificat doit avoir un triangle avec la clé dessous)."; exit 1 ;;
          esac
          echo "::notice::Certificat OK : $(echo "$ids" | grep -o '"[^"]*"' | head -1)"

      - name: APPLE_SIGNING_IDENTITY (correspond au certificat)
        if: steps.cert.outcome == 'success'
        run: |
          ids=$(security find-identity -v -p codesigning "$RUNNER_TEMP/check.keychain")
          case "$ids" in
            *"\"$APPLE_SIGNING_IDENTITY\""*) echo "OK : identité trouvée." ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY ne correspond pas à l'identité du certificat (celle-ci est donnée par la note « Certificat OK »). Il faut le texte exact, sans guillemets."; exit 1 ;;
          esac
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application:"*) echo "OK : certificat Developer ID Application." ;;
            *) echo "::error::Il faut un certificat « Developer ID Application », pas « $APPLE_SIGNING_IDENTITY »."; exit 1 ;;
          esac

      - name: APPLE_API_KEY, APPLE_API_ISSUER et APPLE_API_PRIVATE_KEY (Apple accepte la clé)
        if: always()
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "::error::APPLE_API_PRIVATE_KEY doit contenir tout le fichier .p8, ligne -----BEGIN PRIVATE KEY----- comprise."; exit 1
          fi
          if ! printf '%s' "$APPLE_API_KEY" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_API_KEY doit être le Key ID (10 caractères, majuscules et chiffres), il en fait ${#APPLE_API_KEY}."; exit 1
          fi
          if ! printf '%s' "$APPLE_API_ISSUER" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error::APPLE_API_ISSUER doit être l'Issuer ID (36 caractères avec des tirets), il en fait ${#APPLE_API_ISSUER}."; exit 1
          fi
          if ! xcrun notarytool history --key "$key_path" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > /dev/null 2> "$RUNNER_TEMP/notary.err"; then
            echo "::error::Apple refuse la clé de notarisation : $(head -c 300 "$RUNNER_TEMP/notary.err" | tr '\n' ' ')"; exit 1
          fi
          echo "::notice::Clé de notarisation OK : Apple l'accepte."

      - name: Nettoyage
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/check.keychain" 2>/dev/null || true
