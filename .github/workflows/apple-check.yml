# Vérifie les secrets de signature Apple sans rien fabriquer ni publier (onglet Actions, « Run workflow »).
# Chaque étape teste un point : celle qui échoue désigne le secret à corriger.
name: Vérifier la signature Apple

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      - name: Les six secrets sont présents
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; else echo "OK : $name"; fi
          done
          exit $missing

      - name: APPLE_CERTIFICATE et APPLE_CERTIFICATE_PASSWORD (le .p12 s'ouvre)
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/check.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/check.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/check.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          echo "Identités trouvées dans le certificat :"
          security find-identity -v -p codesigning "$RUNNER_TEMP/check.keychain"

      - name: APPLE_SIGNING_IDENTITY (correspond au certificat)
        run: |
          ids=$(security find-identity -v -p codesigning "$RUNNER_TEMP/check.keychain")
          case "$ids" in
            *"\"$APPLE_SIGNING_IDENTITY\""*) echo "OK : identité trouvée." ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY ne correspond à aucune identité du certificat (voir l'étape précédente)."; exit 1 ;;
          esac
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application:"*) echo "OK : certificat Developer ID Application." ;;
            *) echo "::error::Il faut un certificat « Developer ID Application », pas « $APPLE_SIGNING_IDENTITY »."; exit 1 ;;
          esac

      - name: APPLE_API_KEY, APPLE_API_ISSUER et APPLE_API_PRIVATE_KEY (Apple accepte la clé)
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          xcrun notarytool history --key "$key_path" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > /dev/null
          echo "OK : la clé de notarisation est acceptée par Apple."

      - name: Nettoyage
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/check.keychain" 2>/dev/null || true
